<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Home / X</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22white%22 d=%22M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z%22/></svg>" />
<style>
  :root {
    --bg: #000000;
    --card: #16181C;
    --card-hover: #080808;
    --border: #2F3336;
    --text: #E7E9EA;
    --text-muted: #71767B;
    --accent: #1D9BF0;
    --red: #F91880;
    --green: #00BA7C;
    --trump-bg: #0A0800;
    --bureau-bg: #0A0000;
    --bureau-border: #CC0000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; max-width: 600px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; padding-bottom: 56px; }
  a { color: var(--accent); text-decoration: none; }

  /* HEADER */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display: grid;
    grid-template-columns: 56px 1fr 56px;
    align-items: center;
    height: 53px;
    padding: 0 4px;
  }
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    border: none;
    background: transparent;
    color: var(--text);
    margin-left: 8px;
  }
  .back-btn:hover { background: rgba(231,233,234,0.1); }
  .back-btn svg { width: 20px; height: 20px; }
  .x-logo {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .x-logo svg { width: 30px; height: 30px; fill: var(--text); }
  .header-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 53px;
  }
  .tab {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    color: var(--text-muted);
    font-size: 15px;
    font-weight: 500;
    position: relative;
  }
  .tab:hover { background: rgba(231,233,234,0.03); }
  .tab.active { color: var(--text); font-weight: 700; }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    height: 4px;
    width: 56px;
    background: var(--accent);
    border-radius: 9999px;
  }

  /* TWEETS */
  .feed { display: flex; flex-direction: column; }
  .tweet {
    display: grid;
    grid-template-columns: 56px 1fr;
    padding: 12px 16px 4px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeIn 0.4s ease forwards;
  }
  .tweet:hover { background: var(--card-hover); }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .tweet.trump { background: var(--trump-bg); }
  .tweet.trump:hover { background: #100A00; }
  .tweet.bureau {
    background: var(--bureau-bg);
    border-left: 3px solid var(--bureau-border);
    padding-left: 13px;
  }
  .tweet.bureau:hover { background: #140000; }
  .tweet.stan-final { padding-top: 16px; padding-bottom: 8px; }
  .tweet.stan-final .tweet-text { font-size: 22px; line-height: 28px; }
  .tweet.stan-final .stan-thumb { font-size: 46px; line-height: 1.1; display: inline-block; }

  /* avatar column */
  .avatar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #333;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: white;
    font-size: 16px;
    user-select: none;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.stan { background: #555; }
  .avatar.bureau {
    background: #CC0000;
    color: white;
    font-size: 22px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(204,0,0,0.6); }
    50% { box-shadow: 0 0 0 6px rgba(204,0,0,0); }
  }

  /* reply line connecting parent to child */
  .reply-line {
    width: 2px;
    background: var(--border);
    flex: 1;
    margin-top: 4px;
    min-height: 12px;
  }
  .tweet.has-reply-below { padding-bottom: 0; }
  .tweet.has-reply-below .reply-line { display: block; }

  .tweet.is-reply .avatar-col::before {
    content: '';
    position: absolute;
    top: -8px;
    width: 2px;
    height: 16px;
    background: var(--border);
  }

  /* tweet body */
  .tweet-body { min-width: 0; padding-left: 4px; }
  .tweet-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    line-height: 20px;
    margin-bottom: 2px;
  }
  .display-name {
    color: var(--text);
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60%;
  }
  .verified-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .verified-badge svg { width: 18px; height: 18px; }
  .verified-blue { fill: #1D9BF0; }
  .verified-gold { fill: #E0B341; }
  .handle, .dot-sep, .time-ago {
    color: var(--text-muted);
    font-size: 15px;
  }
  .more-btn {
    margin-left: auto;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .more-btn:hover { background: rgba(29,155,240,0.1); color: var(--accent); }

  .reply-context {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 4px;
  }
  .reply-context .at { color: var(--accent); }

  .tweet-text {
    color: var(--text);
    font-size: 15px;
    line-height: 20px;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 12px;
  }
  .tweet.trump .tweet-text .caps { font-weight: 600; }

  /* actions */
  .actions {
    display: flex;
    justify-content: space-between;
    max-width: 425px;
    margin-top: 4px;
    margin-left: -8px;
  }
  .action {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    padding: 4px 6px;
    border-radius: 9999px;
    transition: color 0.15s, background 0.15s;
    user-select: none;
  }
  .action svg { width: 18px; height: 18px; fill: currentColor; }
  .action:hover.reply { color: var(--accent); background: rgba(29,155,240,0.1); }
  .action:hover.retweet, .action.retweeted { color: var(--green); }
  .action:hover.retweet { background: rgba(0,186,124,0.1); }
  .action:hover.like, .action.liked { color: var(--red); }
  .action:hover.like { background: rgba(249,24,128,0.1); }
  .action:hover.views { color: var(--accent); background: rgba(29,155,240,0.1); }
  .action:hover.share { color: var(--accent); background: rgba(29,155,240,0.1); }
  .action.liked svg { fill: var(--red); }
  .action.retweeted svg { fill: var(--green); }

  /* footer */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 53px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
    max-width: 600px;
    margin: 0 auto;
  }
  .nav-btn {
    background: transparent;
    border: none;
    width: 56px;
    height: 44px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: rgba(231,233,234,0.1); }
  .nav-btn svg { width: 26px; height: 26px; fill: currentColor; }

  /* legal */
  .legal {
    padding: 16px 16px 24px 16px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    text-align: left;
  }
  .legal .links a {
    color: var(--text-muted);
    margin-right: 12px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .legal .links a:hover { text-decoration: underline; }
  .legal .small { margin-top: 8px; }

  /* like animation pop */
  @keyframes likePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .action.like.just-liked svg { animation: likePop 0.35s ease; }

  @media (max-width: 500px) {
    .display-name { font-size: 15px; }
    .tweet { padding: 10px 12px 4px 12px; }
    .tweet.bureau { padding-left: 9px; }
  }
</style>

/* ============= UTILITIES ============= */
function formatCount(n) {
  if (n < 1000) return String(n);
  if (n < 1000000) {
    const k = n / 1000;
    return (k >= 100 ? Math.round(k) : (k % 1 === 0 ? k : k.toFixed(1).replace(/\.0$/, ''))) + 'K';
  }
  const m = n / 1000000;
  return (m % 1 === 0 ? m : m.toFixed(1)) + 'M';
}

function avatarMarkup(tw) {
  if (tw.avatarType === 'twitter') {
    const url = `https://unavatar.io/twitter/${tw.avatarParams}`;
    const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(tw.displayName)}&background=333&color=fff&size=80`;
    return `<div class="avatar"><img src="${url}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'"></div>`;
  }
  if (tw.avatarType === 'initials') {
    const p = tw.avatarParams;
    return `<div class="avatar" style="background:${p.bg};color:${p.color};">${p.name}</div>`;
  }
  if (tw.avatarType === 'egg') {
    // anonymous default avatar - grey w/ silhouette
    return `<div class="avatar" style="background:#3a3a3a;">
      <svg viewBox="0 0 24 24" width="32" height="32" style="display:block;"><path fill="#71767B" d="M12 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM4 21c0-4.4 3.6-8 8-8s8 3.6 8 8H4z"/></svg>
    </div>`;
  }
  if (tw.avatarType === 'stan') {
    return `<div class="avatar stan"></div>`;
  }
  if (tw.avatarType === 'bureau') {
    return `<div class="avatar bureau">★</div>`;
  }
  return `<div class="avatar"></div>`;
}

function verifiedMarkup(v) {
  if (v === 'blue') return `<span class="verified-badge">${ICONS.verifiedBlue}</span>`;
  if (v === 'gold') return `<span class="verified-badge">${ICONS.verifiedGold}</span>`;
  if (v === 'red-star') return `<span class="verified-badge" style="color:#CC0000;font-size:16px;line-height:18px;display:inline-flex;align-items:center;justify-content:center;">★</span>`;
  return '';
}

function renderTweetText(text, variant) {
  let escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  // Stan final: enlarge thumbs up
  // (handled by font-size on .stan-thumb wrapper)
  if (variant === 'stan-final') {
    escaped = escaped.replace(/👍/g, '<span class="stan-thumb">👍</span>');
  }
  if (variant === 'trump') {
    // Wrap sequences of 2+ ALL-CAPS words (with optional punctuation/spaces) as bolder
    escaped = escaped.replace(/(\b[A-Z]{2,}(?:[^a-z\n<>]+[A-Z]{2,})+\b!?)/g, '<span class="caps">$1</span>');
  }
  return escaped;
}

function tweetHTML(tw) {
  const classes = ['tweet'];
  if (tw.variant) classes.push(tw.variant);
  if (tw.isReply) classes.push('is-reply');
  if (tw.hasReplyBelow) classes.push('has-reply-below');

  const replyContext = tw.replyTo
    ? `<div class="reply-context">Replying to <span class="at">@${tw.replyTo}</span></div>`
    : '';

  return `
    <article class="${classes.join(' ')}" data-id="${tw.id}">
      <div class="avatar-col">
        ${avatarMarkup(tw)}
        ${tw.hasReplyBelow ? '<div class="reply-line"></div>' : ''}
      </div>
      <div class="tweet-body">
        <div class="tweet-head">
          <span class="display-name">${tw.displayName}</span>
          ${verifiedMarkup(tw.verified)}
          <span class="handle">@${tw.handle}</span>
          <span class="dot-sep">·</span>
          <span class="time-ago">${tw.time}</span>
          <button class="more-btn" aria-label="More">${ICONS.more}</button>
        </div>
        ${replyContext}
        <div class="tweet-text">${renderTweetText(tw.text, tw.variant)}</div>
        <div class="actions">
          <button class="action reply" aria-label="Reply">${ICONS.reply}<span class="count">${formatCount(Math.max(1, Math.round(tw.retweets * 0.6)))}</span></button>
          <button class="action retweet" aria-label="Repost" data-count="${tw.retweets}">${ICONS.retweet}<span class="count">${formatCount(tw.retweets)}</span></button>
          <button class="action like" aria-label="Like" data-count="${tw.likes}" data-target="${tw.likes}" ${tw.animateLikes ? 'data-animate="1"' : ''}>
            <span class="like-icon">${ICONS.like}</span>
            <span class="count">${tw.animateLikes ? '0' : formatCount(tw.likes)}</span>
          </button>
          <button class="action views" aria-label="Views">${ICONS.views}<span class="count">${formatCount(tw.likes * 8)}</span></button>
          <button class="action share" aria-label="Share">${ICONS.share}</button>
        </div>
      </div>
    </article>
  `;
}

/* ============= RENDER ============= */
const feed = document.getElementById('feed');
feed.innerHTML = TWEETS.map(tweetHTML).join('');

// Stagger fade-in animation timing
const tweetEls = feed.querySelectorAll('.tweet');
tweetEls.forEach((el, i) => {
  let delay;
  if (i === 0) delay = 0;
  else if (i === 1) delay = 150;
  else if (i === 2) delay = 300;
  else delay = Math.min(800, 300 + (i - 2) * 100);
  el.style.animationDelay = delay + 'ms';
});

/* ============= INTERACTIONS ============= */
// Like
feed.addEventListener('click', (e) => {
  const likeBtn = e.target.closest('.action.like');
  const rtBtn = e.target.closest('.action.retweet');
  if (likeBtn) {
    e.stopPropagation();
    const countEl = likeBtn.querySelector('.count');
    let n = parseInt(likeBtn.dataset.count, 10);
    if (likeBtn.classList.contains('liked')) {
      n -= 1;
      likeBtn.classList.remove('liked');
      const svg = likeBtn.querySelector('.like-icon');
      if (svg) svg.innerHTML = ICONS.like;
    } else {
      n += 1;
      likeBtn.classList.add('liked', 'just-liked');
      const svg = likeBtn.querySelector('.like-icon');
      if (svg) svg.innerHTML = ICONS.liked;
      setTimeout(() => likeBtn.classList.remove('just-liked'), 400);
    }
    likeBtn.dataset.count = n;
    if (!likeBtn.dataset.animate || likeBtn.dataset.done === '1') {
      countEl.textContent = formatCount(n);
    }
  }
  if (rtBtn) {
    e.stopPropagation();
    const countEl = rtBtn.querySelector('.count');
    let n = parseInt(rtBtn.dataset.count, 10);
    if (rtBtn.classList.contains('retweeted')) {
      n -= 1;
      rtBtn.classList.remove('retweeted');
    } else {
      n += 1;
      rtBtn.classList.add('retweeted');
    }
    rtBtn.dataset.count = n;
    countEl.textContent = formatCount(n);
  }
});

/* ============= STAN ANIMATED COUNT ============= */
function animateCount(el, btn, target, duration) {
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    // ease out
    const eased = 1 - Math.pow(1 - t, 3);
    const v = Math.round(target * eased);
    el.textContent = formatCount(v);
    if (t < 1) requestAnimationFrame(frame);
    else {
      btn.dataset.done = '1';
      btn.dataset.count = target;
    }
  }
  requestAnimationFrame(frame);
}

const animatedLikes = feed.querySelectorAll('.action.like[data-animate="1"]');
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const btn = entry.target;
      const target = parseInt(btn.dataset.target, 10);
      const countEl = btn.querySelector('.count');
      animateCount(countEl, btn, target, 2000);
      io.unobserve(btn);
    }
  });
}, { threshold: 0.5 });
animatedLikes.forEach(el => io.observe(el));
</script>
